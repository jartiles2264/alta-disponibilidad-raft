# ============================================================
#  CLUSTER NODES CONFIG FOR DOCKER ENVIRONMENT
# ============================================================
#
#  IPs estáticas asignadas dentro de la red Docker banco-net.
#  Compatible con el sidecar que acepta hostname O IP.
#
#  Esta configuración emula el clúster completo de 5 nodos
#  en una sola máquina para desarrollo y CI/CD.
# ============================================================

# --- IPs de los nodos (red Docker 172.20.0.0/24) ------------
NODE1_IP=172.20.0.101
NODE2_IP=172.20.0.102
NODE3_IP=172.20.0.103
NODE4_IP=172.20.0.104
NODE5_IP=172.20.0.105

# --- Nodo que arranca como maestro de MySQL -----------------
INITIAL_PRIMARY_NODE=1

# --- Red Docker (no aplica prefix/gateway del lab) ----------
DEFAULT_PREFIX_LENGTH=24
DEFAULT_GATEWAY=172.20.0.1

# --- Puertos ------------------------------------------------
MYSQL_PORT=3306
ETCD_CLIENT_PORT=2379
ETCD_PEER_PORT=2380

# --- Version de etcd ----------------------------------------
ETCD_VERSION=v3.5.12
ETCD_CLUSTER_TOKEN=etcd-cluster-docker
