# ─────────────────────────────────────────────────────────────
# Docker Compose — Clúster Distribuido en Red Local (LAN / Hotspot)
#
# ARQUITECTURA DE RED (cross-platform: Mac, Windows, Linux):
#   - Cada contenedor usa la red bridge estándar de Docker
#   - El sidecar se conecta a etcd y MySQL LOCAL via nombre de
#     contenedor (dentro de la misma red Docker)
#   - El sidecar alcanza los nodos REMOTOS via IP de la LAN/Hotspot
#     (los puertos están publicados en 0.0.0.0)
#   - NO usa network_mode: host (no funciona en macOS)
#
# USO:
#   docker compose --profile node-1 up -d --build
#   docker compose --profile node-2 up -d --build
#   docker compose --profile node-3 up -d --build
#   docker compose --profile node-4 up -d --build
# ─────────────────────────────────────────────────────────────

services:
  # ═══════════════════════════════════════════════════════════
  # ETCD CLUSTER (3 nodos)
  # Puertos publicados en 0.0.0.0 para que los nodos remotos
  # puedan conectarse via LAN IP.
  # ═══════════════════════════════════════════════════════════
  etcd-1:
    profiles: ["node-1"]
    image: gcr.io/etcd-development/etcd:v3.5.12
    container_name: etcd-1
    command:
      - etcd
      - --name=etcd-1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://${LAN_IP_1}:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://${LAN_IP_1}:2380
      - --initial-cluster=etcd-1=http://${LAN_IP_1}:2380,etcd-2=http://${LAN_IP_2}:2380,etcd-3=http://${LAN_IP_3}:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=etcd-cluster-lan
    ports:
      - "0.0.0.0:2379:2379"
      - "0.0.0.0:2380:2380"
    volumes:
      - etcd-1-data:/etcd-data
    restart: unless-stopped

  etcd-2:
    profiles: ["node-2"]
    image: gcr.io/etcd-development/etcd:v3.5.12
    container_name: etcd-2
    command:
      - etcd
      - --name=etcd-2
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://${LAN_IP_2}:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://${LAN_IP_2}:2380
      - --initial-cluster=etcd-1=http://${LAN_IP_1}:2380,etcd-2=http://${LAN_IP_2}:2380,etcd-3=http://${LAN_IP_3}:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=etcd-cluster-lan
    ports:
      - "0.0.0.0:2379:2379"
      - "0.0.0.0:2380:2380"
    volumes:
      - etcd-2-data:/etcd-data
    restart: unless-stopped

  etcd-3:
    profiles: ["node-3"]
    image: gcr.io/etcd-development/etcd:v3.5.12
    container_name: etcd-3
    command:
      - etcd
      - --name=etcd-3
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://${LAN_IP_3}:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://${LAN_IP_3}:2380
      - --initial-cluster=etcd-1=http://${LAN_IP_1}:2380,etcd-2=http://${LAN_IP_2}:2380,etcd-3=http://${LAN_IP_3}:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=etcd-cluster-lan
    ports:
      - "0.0.0.0:2379:2379"
      - "0.0.0.0:2380:2380"
    volumes:
      - etcd-3-data:/etcd-data
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════
  # MYSQL CLUSTER (5 nodos)
  # ═══════════════════════════════════════════════════════════
  mysql-node-1:
    profiles: ["node-1"]
    image: mysql:8.0
    container_name: mysql-node-1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: banco_db
    command: >-
      --server-id=1
      --log-bin=mysql-bin
      --binlog-format=ROW
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --log-replica-updates=ON
      --bind-address=0.0.0.0
      --skip-name-resolve
    ports:
      - "0.0.0.0:3306:3306"
    volumes:
      - mysql-1-data:/var/lib/mysql
      - ./docker/mysql/init-users.sql:/docker-entrypoint-initdb.d/01-init-users.sql:ro
      - ./docker/mysql/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
    restart: unless-stopped

  mysql-node-2:
    profiles: ["node-2"]
    image: mysql:8.0
    container_name: mysql-node-2
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: banco_db
    command: >-
      --server-id=2
      --log-bin=mysql-bin
      --binlog-format=ROW
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --log-replica-updates=ON
      --bind-address=0.0.0.0
      --skip-name-resolve
    ports:
      - "0.0.0.0:3306:3306"
    volumes:
      - mysql-2-data:/var/lib/mysql
      - ./docker/mysql/init-users.sql:/docker-entrypoint-initdb.d/01-init-users.sql:ro
      - ./docker/mysql/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
    restart: unless-stopped

  mysql-node-3:
    profiles: ["node-3"]
    image: mysql:8.0
    container_name: mysql-node-3
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: banco_db
    command: >-
      --server-id=3
      --log-bin=mysql-bin
      --binlog-format=ROW
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --log-replica-updates=ON
      --bind-address=0.0.0.0
      --skip-name-resolve
    ports:
      - "0.0.0.0:3306:3306"
    volumes:
      - mysql-3-data:/var/lib/mysql
      - ./docker/mysql/init-users.sql:/docker-entrypoint-initdb.d/01-init-users.sql:ro
      - ./docker/mysql/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
    restart: unless-stopped

  mysql-node-4:
    profiles: ["node-4"]
    image: mysql:8.0
    container_name: mysql-node-4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: banco_db
    command: >-
      --server-id=4
      --log-bin=mysql-bin
      --binlog-format=ROW
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --log-replica-updates=ON
      --bind-address=0.0.0.0
      --skip-name-resolve
    ports:
      - "0.0.0.0:3306:3306"
    volumes:
      - mysql-4-data:/var/lib/mysql
      - ./docker/mysql/init-users.sql:/docker-entrypoint-initdb.d/01-init-users.sql:ro
      - ./docker/mysql/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
    restart: unless-stopped

  mysql-node-5:
    profiles: ["node-5"]
    image: mysql:8.0
    container_name: mysql-node-5
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: banco_db
    command: >-
      --server-id=5
      --log-bin=mysql-bin
      --binlog-format=ROW
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --log-replica-updates=ON
      --bind-address=0.0.0.0
      --skip-name-resolve
    ports:
      - "0.0.0.0:3306:3306"
    volumes:
      - mysql-5-data:/var/lib/mysql
      - ./docker/mysql/init-users.sql:/docker-entrypoint-initdb.d/01-init-users.sql:ro
      - ./docker/mysql/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════
  # SIDECAR AGENTS
  #
  # Cada sidecar se conecta a su etcd LOCAL por nombre de
  # contenedor (bridge Docker), y a los etcd REMOTOS por LAN IP.
  # Para MySQL LOCAL usa el nombre del contenedor.
  # ═══════════════════════════════════════════════════════════
  sidecar-1:
    profiles: ["node-1"]
    build:
      context: .
      dockerfile: docker/Dockerfile.sidecar
    container_name: sidecar-1
    depends_on:
      - mysql-node-1
      - etcd-1
    environment:
      NODE_IP: ${LAN_IP_1}
      MYSQL_HOST: mysql-node-1
      MYSQL_PORT: "3306"
      SIDECAR_MYSQL_USER: "sidecar"
      SIDECAR_MYSQL_PASSWORD: ${SIDECAR_MYSQL_PASSWORD}
      MYSQL_REPL_USER: "replica_user"
      MYSQL_REPL_PASSWORD: ${MYSQL_REPL_PASSWORD}
      MYSQL_NODES: "${LAN_IP_1},${LAN_IP_2},${LAN_IP_3},${LAN_IP_4},${LAN_IP_5}"
      INITIAL_PRIMARY_IP: ${LAN_IP_1}
      # etcd LOCAL por nombre de contenedor, REMOTOS por LAN IP
      ETCD_ENDPOINTS: "etcd-1:2379,${LAN_IP_2}:2379,${LAN_IP_3}:2379"
      ETCD_KEY: "/banco/mysql/primary"
      LEASE_TTL: "10"
      CHECK_INTERVAL: "3"
      MAX_DEFERRALS: "5"
    restart: unless-stopped

  sidecar-2:
    profiles: ["node-2"]
    build:
      context: .
      dockerfile: docker/Dockerfile.sidecar
    container_name: sidecar-2
    depends_on:
      - mysql-node-2
      - etcd-2
    environment:
      NODE_IP: ${LAN_IP_2}
      MYSQL_HOST: mysql-node-2
      MYSQL_PORT: "3306"
      SIDECAR_MYSQL_USER: "sidecar"
      SIDECAR_MYSQL_PASSWORD: ${SIDECAR_MYSQL_PASSWORD}
      MYSQL_REPL_USER: "replica_user"
      MYSQL_REPL_PASSWORD: ${MYSQL_REPL_PASSWORD}
      MYSQL_NODES: "${LAN_IP_1},${LAN_IP_2},${LAN_IP_3},${LAN_IP_4},${LAN_IP_5}"
      INITIAL_PRIMARY_IP: ${LAN_IP_1}
      # etcd LOCAL por nombre de contenedor, REMOTOS por LAN IP
      ETCD_ENDPOINTS: "${LAN_IP_1}:2379,etcd-2:2379,${LAN_IP_3}:2379"
      ETCD_KEY: "/banco/mysql/primary"
      LEASE_TTL: "10"
      CHECK_INTERVAL: "3"
      MAX_DEFERRALS: "5"
    restart: unless-stopped

  sidecar-3:
    profiles: ["node-3"]
    build:
      context: .
      dockerfile: docker/Dockerfile.sidecar
    container_name: sidecar-3
    depends_on:
      - mysql-node-3
      - etcd-3
    environment:
      NODE_IP: ${LAN_IP_3}
      MYSQL_HOST: mysql-node-3
      MYSQL_PORT: "3306"
      SIDECAR_MYSQL_USER: "sidecar"
      SIDECAR_MYSQL_PASSWORD: ${SIDECAR_MYSQL_PASSWORD}
      MYSQL_REPL_USER: "replica_user"
      MYSQL_REPL_PASSWORD: ${MYSQL_REPL_PASSWORD}
      MYSQL_NODES: "${LAN_IP_1},${LAN_IP_2},${LAN_IP_3},${LAN_IP_4},${LAN_IP_5}"
      INITIAL_PRIMARY_IP: ${LAN_IP_1}
      # etcd LOCAL por nombre de contenedor, REMOTOS por LAN IP
      ETCD_ENDPOINTS: "${LAN_IP_1}:2379,${LAN_IP_2}:2379,etcd-3:2379"
      ETCD_KEY: "/banco/mysql/primary"
      LEASE_TTL: "10"
      CHECK_INTERVAL: "3"
      MAX_DEFERRALS: "5"
    restart: unless-stopped

  sidecar-4:
    profiles: ["node-4"]
    build:
      context: .
      dockerfile: docker/Dockerfile.sidecar
    container_name: sidecar-4
    depends_on:
      - mysql-node-4
    environment:
      NODE_IP: ${LAN_IP_4}
      MYSQL_HOST: mysql-node-4
      MYSQL_PORT: "3306"
      SIDECAR_MYSQL_USER: "sidecar"
      SIDECAR_MYSQL_PASSWORD: ${SIDECAR_MYSQL_PASSWORD}
      MYSQL_REPL_USER: "replica_user"
      MYSQL_REPL_PASSWORD: ${MYSQL_REPL_PASSWORD}
      MYSQL_NODES: "${LAN_IP_1},${LAN_IP_2},${LAN_IP_3},${LAN_IP_4},${LAN_IP_5}"
      INITIAL_PRIMARY_IP: ${LAN_IP_1}
      ETCD_ENDPOINTS: "${LAN_IP_1}:2379,${LAN_IP_2}:2379,${LAN_IP_3}:2379"
      ETCD_KEY: "/banco/mysql/primary"
      LEASE_TTL: "10"
      CHECK_INTERVAL: "3"
      MAX_DEFERRALS: "5"
    restart: unless-stopped

  sidecar-5:
    profiles: ["node-5"]
    build:
      context: .
      dockerfile: docker/Dockerfile.sidecar
    container_name: sidecar-5
    depends_on:
      - mysql-node-5
    environment:
      NODE_IP: ${LAN_IP_5}
      MYSQL_HOST: mysql-node-5
      MYSQL_PORT: "3306"
      SIDECAR_MYSQL_USER: "sidecar"
      SIDECAR_MYSQL_PASSWORD: ${SIDECAR_MYSQL_PASSWORD}
      MYSQL_REPL_USER: "replica_user"
      MYSQL_REPL_PASSWORD: ${MYSQL_REPL_PASSWORD}
      MYSQL_NODES: "${LAN_IP_1},${LAN_IP_2},${LAN_IP_3},${LAN_IP_4},${LAN_IP_5}"
      INITIAL_PRIMARY_IP: ${LAN_IP_1}
      ETCD_ENDPOINTS: "${LAN_IP_1}:2379,${LAN_IP_2}:2379,${LAN_IP_3}:2379"
      ETCD_KEY: "/banco/mysql/primary"
      LEASE_TTL: "10"
      CHECK_INTERVAL: "3"
      MAX_DEFERRALS: "5"
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════
  # APLICACIÓN BANCARIA
  # ═══════════════════════════════════════════════════════════
  banco-app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: banco-app
    environment:
      MYSQL_USER: "banco_app"
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: "banco_db"
      MYSQL_PORT: "3306"
      ETCD_ENDPOINTS: "${LAN_IP_1}:2379,${LAN_IP_2}:2379,${LAN_IP_3}:2379"
      ETCD_KEY: "/banco/mysql/primary"
      POOL_SIZE: "5"
      RETRY_MAX: "15"
      FAILOVER_WAIT: "30"
      TRANSFER_INTERVAL: "1"
    restart: unless-stopped
    stdin_open: true
    tty: true

# ═══════════════════════════════════════════════════════════
# VOLUMES
# ═══════════════════════════════════════════════════════════
volumes:
  etcd-1-data:
  etcd-2-data:
  etcd-3-data:
  mysql-1-data:
  mysql-2-data:
  mysql-3-data:
  mysql-4-data:
  mysql-5-data:
