# ─────────────────────────────────────────────────────────────
# Docker Compose — Clúster Distribuido en Red Local (LAN/Hotspot)
#
# ARQUITECTURA DE RED:
#   - etcd y sidecar usan network_mode: host para poder hablar
#     con las otras máquinas a través de la LAN/Hotspot.
#   - MySQL usa puertos mapeados al host (0.0.0.0:3306).
#   - El sidecar se conecta a MySQL via el nombre de contenedor
#     usando host.docker.internal (Mac/Win) o la IP del host.
#
# USO POR NODO:
#   docker compose --profile node-1 up -d   (Maestro)
#   docker compose --profile node-2 up -d
#   docker compose --profile node-3 up -d
#   docker compose --profile node-4 up -d
#   docker compose --profile node-5 up -d
# ─────────────────────────────────────────────────────────────

services:
  # ═══════════════════════════════════════════════════════════
  # ETCD CLUSTER (3 nodos — quórum Raft de 2)
  # Usa network_mode: host para poder hacer peering entre máquinas
  # ═══════════════════════════════════════════════════════════
  etcd-1:
    profiles: ["node-1"]
    image: gcr.io/etcd-development/etcd:v3.5.12
    container_name: etcd-1
    network_mode: host
    command:
      - etcd
      - --name=etcd-1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://${LAN_IP_1}:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://${LAN_IP_1}:2380
      - --initial-cluster=etcd-1=http://${LAN_IP_1}:2380,etcd-2=http://${LAN_IP_2}:2380,etcd-3=http://${LAN_IP_3}:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=etcd-cluster-lan
    volumes:
      - etcd-1-data:/etcd-data
    restart: unless-stopped

  etcd-2:
    profiles: ["node-2"]
    image: gcr.io/etcd-development/etcd:v3.5.12
    container_name: etcd-2
    network_mode: host
    command:
      - etcd
      - --name=etcd-2
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://${LAN_IP_2}:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://${LAN_IP_2}:2380
      - --initial-cluster=etcd-1=http://${LAN_IP_1}:2380,etcd-2=http://${LAN_IP_2}:2380,etcd-3=http://${LAN_IP_3}:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=etcd-cluster-lan
    volumes:
      - etcd-2-data:/etcd-data
    restart: unless-stopped

  etcd-3:
    profiles: ["node-3"]
    image: gcr.io/etcd-development/etcd:v3.5.12
    container_name: etcd-3
    network_mode: host
    command:
      - etcd
      - --name=etcd-3
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://${LAN_IP_3}:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://${LAN_IP_3}:2380
      - --initial-cluster=etcd-1=http://${LAN_IP_1}:2380,etcd-2=http://${LAN_IP_2}:2380,etcd-3=http://${LAN_IP_3}:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=etcd-cluster-lan
    volumes:
      - etcd-3-data:/etcd-data
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════
  # MYSQL CLUSTER (5 nodos distribuidos)
  # MySQL NO puede usar network_mode: host con nombre de contenedor,
  # usa puertos mapeados al host normal.
  # ═══════════════════════════════════════════════════════════
  mysql-node-1:
    profiles: ["node-1"]
    image: mysql:8.0
    container_name: mysql-node-1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: banco_db
    command: >-
      --server-id=1
      --log-bin=mysql-bin
      --binlog-format=ROW
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --log-replica-updates=ON
      --bind-address=0.0.0.0
      --skip-name-resolve
    ports:
      - "0.0.0.0:3306:3306"
    volumes:
      - mysql-1-data:/var/lib/mysql
      - ./docker/mysql/init-users.sql:/docker-entrypoint-initdb.d/01-init-users.sql:ro
      - ./docker/mysql/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
    restart: unless-stopped

  mysql-node-2:
    profiles: ["node-2"]
    image: mysql:8.0
    container_name: mysql-node-2
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: banco_db
    command: >-
      --server-id=2
      --log-bin=mysql-bin
      --binlog-format=ROW
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --log-replica-updates=ON
      --bind-address=0.0.0.0
      --skip-name-resolve
    ports:
      - "0.0.0.0:3306:3306"
    volumes:
      - mysql-2-data:/var/lib/mysql
      - ./docker/mysql/init-users.sql:/docker-entrypoint-initdb.d/01-init-users.sql:ro
      - ./docker/mysql/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
    restart: unless-stopped

  mysql-node-3:
    profiles: ["node-3"]
    image: mysql:8.0
    container_name: mysql-node-3
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: banco_db
    command: >-
      --server-id=3
      --log-bin=mysql-bin
      --binlog-format=ROW
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --log-replica-updates=ON
      --bind-address=0.0.0.0
      --skip-name-resolve
    ports:
      - "0.0.0.0:3306:3306"
    volumes:
      - mysql-3-data:/var/lib/mysql
      - ./docker/mysql/init-users.sql:/docker-entrypoint-initdb.d/01-init-users.sql:ro
      - ./docker/mysql/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
    restart: unless-stopped

  mysql-node-4:
    profiles: ["node-4"]
    image: mysql:8.0
    container_name: mysql-node-4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: banco_db
    command: >-
      --server-id=4
      --log-bin=mysql-bin
      --binlog-format=ROW
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --log-replica-updates=ON
      --bind-address=0.0.0.0
      --skip-name-resolve
    ports:
      - "0.0.0.0:3306:3306"
    volumes:
      - mysql-4-data:/var/lib/mysql
      - ./docker/mysql/init-users.sql:/docker-entrypoint-initdb.d/01-init-users.sql:ro
      - ./docker/mysql/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
    restart: unless-stopped

  mysql-node-5:
    profiles: ["node-5"]
    image: mysql:8.0
    container_name: mysql-node-5
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: banco_db
    command: >-
      --server-id=5
      --log-bin=mysql-bin
      --binlog-format=ROW
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --log-replica-updates=ON
      --bind-address=0.0.0.0
      --skip-name-resolve
    ports:
      - "0.0.0.0:3306:3306"
    volumes:
      - mysql-5-data:/var/lib/mysql
      - ./docker/mysql/init-users.sql:/docker-entrypoint-initdb.d/01-init-users.sql:ro
      - ./docker/mysql/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════
  # SIDECAR AGENTS (1 por máquina)
  # Usa network_mode: host para conectarse tanto al etcd local
  # como a los MySQL y etcd de las otras máquinas en la LAN.
  # MYSQL_HOST apunta a 127.0.0.1 porque MySQL está en el mismo host.
  # ═══════════════════════════════════════════════════════════
  sidecar-1:
    profiles: ["node-1"]
    build:
      context: .
      dockerfile: docker/Dockerfile.sidecar
    container_name: sidecar-1
    network_mode: host
    environment:
      NODE_IP: ${LAN_IP_1}
      MYSQL_HOST: "127.0.0.1"
      MYSQL_PORT: "3306"
      SIDECAR_MYSQL_USER: "sidecar"
      SIDECAR_MYSQL_PASSWORD: ${SIDECAR_MYSQL_PASSWORD}
      MYSQL_REPL_USER: "replica_user"
      MYSQL_REPL_PASSWORD: ${MYSQL_REPL_PASSWORD}
      MYSQL_NODES: "${LAN_IP_1},${LAN_IP_2},${LAN_IP_3},${LAN_IP_4},${LAN_IP_5}"
      INITIAL_PRIMARY_IP: ${LAN_IP_1}
      ETCD_ENDPOINTS: "${LAN_IP_1}:2379,${LAN_IP_2}:2379,${LAN_IP_3}:2379"
      ETCD_KEY: "/banco/mysql/primary"
      LEASE_TTL: "10"
      CHECK_INTERVAL: "3"
      MAX_DEFERRALS: "5"
    restart: unless-stopped

  sidecar-2:
    profiles: ["node-2"]
    build:
      context: .
      dockerfile: docker/Dockerfile.sidecar
    container_name: sidecar-2
    network_mode: host
    environment:
      NODE_IP: ${LAN_IP_2}
      MYSQL_HOST: "127.0.0.1"
      MYSQL_PORT: "3306"
      SIDECAR_MYSQL_USER: "sidecar"
      SIDECAR_MYSQL_PASSWORD: ${SIDECAR_MYSQL_PASSWORD}
      MYSQL_REPL_USER: "replica_user"
      MYSQL_REPL_PASSWORD: ${MYSQL_REPL_PASSWORD}
      MYSQL_NODES: "${LAN_IP_1},${LAN_IP_2},${LAN_IP_3},${LAN_IP_4},${LAN_IP_5}"
      INITIAL_PRIMARY_IP: ${LAN_IP_1}
      ETCD_ENDPOINTS: "${LAN_IP_1}:2379,${LAN_IP_2}:2379,${LAN_IP_3}:2379"
      ETCD_KEY: "/banco/mysql/primary"
      LEASE_TTL: "10"
      CHECK_INTERVAL: "3"
      MAX_DEFERRALS: "5"
    restart: unless-stopped

  sidecar-3:
    profiles: ["node-3"]
    build:
      context: .
      dockerfile: docker/Dockerfile.sidecar
    container_name: sidecar-3
    network_mode: host
    environment:
      NODE_IP: ${LAN_IP_3}
      MYSQL_HOST: "127.0.0.1"
      MYSQL_PORT: "3306"
      SIDECAR_MYSQL_USER: "sidecar"
      SIDECAR_MYSQL_PASSWORD: ${SIDECAR_MYSQL_PASSWORD}
      MYSQL_REPL_USER: "replica_user"
      MYSQL_REPL_PASSWORD: ${MYSQL_REPL_PASSWORD}
      MYSQL_NODES: "${LAN_IP_1},${LAN_IP_2},${LAN_IP_3},${LAN_IP_4},${LAN_IP_5}"
      INITIAL_PRIMARY_IP: ${LAN_IP_1}
      ETCD_ENDPOINTS: "${LAN_IP_1}:2379,${LAN_IP_2}:2379,${LAN_IP_3}:2379"
      ETCD_KEY: "/banco/mysql/primary"
      LEASE_TTL: "10"
      CHECK_INTERVAL: "3"
      MAX_DEFERRALS: "5"
    restart: unless-stopped

  sidecar-4:
    profiles: ["node-4"]
    build:
      context: .
      dockerfile: docker/Dockerfile.sidecar
    container_name: sidecar-4
    network_mode: host
    environment:
      NODE_IP: ${LAN_IP_4}
      MYSQL_HOST: "127.0.0.1"
      MYSQL_PORT: "3306"
      SIDECAR_MYSQL_USER: "sidecar"
      SIDECAR_MYSQL_PASSWORD: ${SIDECAR_MYSQL_PASSWORD}
      MYSQL_REPL_USER: "replica_user"
      MYSQL_REPL_PASSWORD: ${MYSQL_REPL_PASSWORD}
      MYSQL_NODES: "${LAN_IP_1},${LAN_IP_2},${LAN_IP_3},${LAN_IP_4},${LAN_IP_5}"
      INITIAL_PRIMARY_IP: ${LAN_IP_1}
      ETCD_ENDPOINTS: "${LAN_IP_1}:2379,${LAN_IP_2}:2379,${LAN_IP_3}:2379"
      ETCD_KEY: "/banco/mysql/primary"
      LEASE_TTL: "10"
      CHECK_INTERVAL: "3"
      MAX_DEFERRALS: "5"
    restart: unless-stopped

  sidecar-5:
    profiles: ["node-5"]
    build:
      context: .
      dockerfile: docker/Dockerfile.sidecar
    container_name: sidecar-5
    network_mode: host
    environment:
      NODE_IP: ${LAN_IP_5}
      MYSQL_HOST: "127.0.0.1"
      MYSQL_PORT: "3306"
      SIDECAR_MYSQL_USER: "sidecar"
      SIDECAR_MYSQL_PASSWORD: ${SIDECAR_MYSQL_PASSWORD}
      MYSQL_REPL_USER: "replica_user"
      MYSQL_REPL_PASSWORD: ${MYSQL_REPL_PASSWORD}
      MYSQL_NODES: "${LAN_IP_1},${LAN_IP_2},${LAN_IP_3},${LAN_IP_4},${LAN_IP_5}"
      INITIAL_PRIMARY_IP: ${LAN_IP_1}
      ETCD_ENDPOINTS: "${LAN_IP_1}:2379,${LAN_IP_2}:2379,${LAN_IP_3}:2379"
      ETCD_KEY: "/banco/mysql/primary"
      LEASE_TTL: "10"
      CHECK_INTERVAL: "3"
      MAX_DEFERRALS: "5"
    restart: unless-stopped

  # ═══════════════════════════════════════════════════════════
  # APLICACIÓN BANCARIA (Correr en cualquier máquina con --profile app)
  # ═══════════════════════════════════════════════════════════
  banco-app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: banco-app
    network_mode: host
    environment:
      MYSQL_USER: "banco_app"
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: "banco_db"
      MYSQL_PORT: "3306"
      ETCD_ENDPOINTS: "${LAN_IP_1}:2379,${LAN_IP_2}:2379,${LAN_IP_3}:2379"
      ETCD_KEY: "/banco/mysql/primary"
      POOL_SIZE: "5"
      RETRY_MAX: "15"
      FAILOVER_WAIT: "30"
      TRANSFER_INTERVAL: "1"
    restart: unless-stopped
    stdin_open: true
    tty: true

# ═══════════════════════════════════════════════════════════
# VOLUMES
# ═══════════════════════════════════════════════════════════
volumes:
  etcd-1-data:
  etcd-2-data:
  etcd-3-data:
  mysql-1-data:
  mysql-2-data:
  mysql-3-data:
  mysql-4-data:
  mysql-5-data:
